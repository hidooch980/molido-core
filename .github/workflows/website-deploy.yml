name: MOLIDO Website Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Type check
        working-directory: website
        run: npm run typecheck

      # A CNAME file means a custom domain, which serves from the root
      # rather than the /molido-core/ project sub-path.
      - name: Resolve base path
        id: base
        run: |
          if [ -f website/public/CNAME ]; then
            echo "Custom domain: $(cat website/public/CNAME)"
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "No CNAME; using the project sub-path"
            echo "value=/molido-core/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: website
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
        run: npm run build

      - name: Configure Pages
        # Pages must already be enabled for the repo:
        # Settings -> Pages -> Source: GitHub Actions.
        # The default workflow token cannot create the Pages site itself.
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
