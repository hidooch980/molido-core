name: MOLIDO Website Build


on:
push:
branches:
- main
paths:
- "website/**"
- ".github/workflows/website-build.yml"


pull_request:
branches:
- main
paths:
- "website/**"
- ".github/workflows/website-build.yml"


permissions:
contents: read


jobs:
build:
runs-on: ubuntu-latest


defaults:
  run:
    working-directory: website

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Install dependencies
    run: npm install

  - name: Type check
    run: npm run typecheck

  - name: Build website
    run: npm run build


